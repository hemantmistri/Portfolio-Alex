<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Abstract 3D hero poster</title>
  <desc id="desc">Layered violet rings on a dark, softly lit background.</desc>
  <defs>
    <radialGradient id="background">
      <stop offset="0%" stop-color="#242039"/>
      <stop offset="100%" stop-color="#121214"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d5ccff"/>
      <stop offset="45%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#39305f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#background)"/>
  <circle cx="430" cy="380" r="200" fill="#7c5cff" opacity=".25" filter="url(#glow)"/>
  <g transform="rotate(-28 400 400)" fill="none">
    <ellipse cx="400" cy="400" rx="200" ry="112" stroke="#473c79" stroke-width="54"/>
    <ellipse cx="400" cy="400" rx="200" ry="112" stroke="url(#ring)" stroke-width="32" stroke-dasharray="820 440" stroke-linecap="round"/>
    <ellipse cx="400" cy="400" rx="132" ry="220" stroke="#8be9fd" stroke-opacity=".5" stroke-width="3"/>
  </g>
  <circle cx="566" cy="238" r="11" fill="#f5f5f4"/>
</svg>
