<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Alex Rivera portfolio cover</title>
  <desc id="desc">Dark minimal cover for Alex Rivera creative developer portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0b0c"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="890" cy="190" r="210" fill="url(#glow)" opacity="0.24"/>
  <rect x="90" y="210" width="470" height="170" rx="28" fill="#15171a" stroke="#2a2d31"/>
  <text x="120" y="300" fill="#f5f5f4" font-family="Arial, sans-serif" font-size="72" font-weight="700">ALEX RIVERA</text>
  <text x="120" y="360" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="38">Creative developer</text>
  <text x="120" y="500" fill="#7c5cff" font-family="Arial, sans-serif" font-size="32" letter-spacing="4">PORTFOLIO</text>
</svg>
